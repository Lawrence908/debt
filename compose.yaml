networks:
  web:
    external: true
    name: homelab-web

services:
  debt:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: debt
    restart: unless-stopped
    depends_on:
      - debt-updater
    networks:
      - web
    ports:
      - "8108:80"
    volumes:
      # Read-only here: nginx serves the data layer, the updater owns it.
      - ./data:/usr/share/nginx/html/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  debt-updater:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: debt-updater
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - web
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - FRED_API_KEY=${FRED_API_KEY:-}
      # Set to 1 to have the scheduled run write. Left off so a fresh deploy
      # observes and logs for a cycle before it is trusted to edit the spec.
      - UPDATER_WRITE=${UPDATER_WRITE:-0}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
