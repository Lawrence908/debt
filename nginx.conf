gzip on;
gzip_types application/json application/javascript text/css text/plain;
gzip_min_length 1024;
gzip_proxied any;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The data layer is bind-mounted, not baked into the image, so the updater
    # can rewrite a figure without a rebuild. no-cache keeps a browser from
    # holding a stale figure after a quarterly run.
    location /data/ {
        add_header Cache-Control "no-cache";
        default_type application/json;
    }

    location /api/ {
        proxy_pass http://debt-updater:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
