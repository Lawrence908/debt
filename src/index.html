<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debt Atlas</title>
<meta name="description" content="AI corporate debt, US federal debt and North American household balance sheets on common axes. Every figure carries the date it was true and the place it came from.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/shared-footer/footer.css">
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --plane: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #4a3aa7;
  --tooltip-bg: rgba(252,252,251,0.97);
  --warn: #b3541e;
  --hatch: rgba(252,252,251,0.55);
  /* Recession shading. Low enough that a band reads as context behind the
     line rather than as a second series competing with it. */
  --band-alpha: 0.09;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --plane: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #9085e9;
    --tooltip-bg: rgba(26,26,25,0.97);
    --warn: #e08a4f;
    --hatch: rgba(13,13,13,0.55);
    /* Lifted on dark: the same alpha over a dark plane is nearly invisible. */
    --band-alpha: 0.15;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19;
  --plane: #0d0d0d;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #9085e9;
  --tooltip-bg: rgba(26,26,25,0.97);
  --warn: #e08a4f;
  --hatch: rgba(13,13,13,0.55);
  --band-alpha: 0.15;
}

/* Confidence is load-bearing, not decorative. These three are derived from
   the palette above rather than invented, so the page reads as one system
   while the encoding survives: reported is filed or official, estimate is a
   third-party reconstruction, projection is the output of a model. */
:root {
  --c-reported: var(--series-1);
  --c-estimate: var(--series-2);
  --c-projection: var(--series-4);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--plane);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 8px; }
.num { font-variant-numeric: tabular-nums lining-nums; }

a { color: var(--series-1); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--series-1); outline-offset: 3px; border-radius: 4px; }

/* ---------- masthead ---------- */

.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
header h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.02em; }
header p.sub { margin: 0; color: var(--text-secondary); max-width: 62ch; }
/* Named apart from .chip, which on this page is the confidence tag inside
   tables. Same pill the other trackers wear, different job. */
.statuschip {
  display: inline-flex; align-items: baseline; gap: 8px; margin-top: 16px;
  padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface-1); font-size: 0.82rem; color: var(--text-secondary);
}
.statuschip[hidden] { display: none; }
.statuschip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--series-3); flex: none; align-self: center; }
.statuschip[data-state="signal"] .dot { background: var(--series-2); }
.statuschip b { color: var(--text-primary); font-weight: 650; }
.stamp { margin-top: 10px; font-size: 0.82rem; color: var(--muted); }
.stamp .stale { color: var(--warn); font-weight: 600; }
.muted { color: var(--muted); }

button.theme {
  font: inherit; font-size: 0.82rem; padding: 5px 11px; cursor: pointer; flex: none;
  background: transparent; color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 999px;
}
button.theme:hover { background: var(--grid); }

/* Recession toggles. Swatches carry the band colours so the control explains
   the shading rather than just switching it. */
.bandctl { display: flex; align-items: center; gap: 6px; flex: none; flex-wrap: wrap; }
.bandctl .lbl {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); margin-right: 2px;
}
.bandctl .seg::before {
  content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px;
  margin-right: 6px; vertical-align: -1px;
}
.bandctl [data-band="us"]::before { background: var(--series-1); }
.bandctl [data-band="ca"]::before { background: var(--series-2); }

/* ---------- tiles ---------- */

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 24px 0 8px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.tile .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.tile .value { font-size: 1.85rem; font-weight: 650; letter-spacing: -0.02em; margin-top: 4px; }
.tile .note { font-size: 0.8rem; color: var(--text-secondary); }

/* ---------- cards ---------- */

.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 18px 14px; margin: 16px 0; }
.card h2 { font-size: 1.05rem; margin: 0 0 2px; letter-spacing: -0.01em; }
.card h3 { font-size: 0.95rem; margin: 20px 0 6px; }
.card p.cap { margin: 0 0 12px; font-size: 0.85rem; color: var(--text-secondary); max-width: 74ch; }

section { margin: 30px 0 0; }
section > h2 { font-size: 1.35rem; letter-spacing: -0.015em; margin: 0 0 4px; }
section > p.standfirst { margin: 0 0 6px; color: var(--text-secondary); max-width: 74ch; }

/* ---------- controls ---------- */

.controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px; }
.group { display: flex; gap: 4px; flex-wrap: wrap; }
.group .glabel { font-size: 0.78rem; color: var(--muted); align-self: center; margin-right: 4px; }
button.seg {
  font: inherit; font-size: 0.82rem; padding: 5px 11px; cursor: pointer;
  background: transparent; color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 999px;
}
button.seg:hover { background: var(--grid); }
button.seg[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }

.legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 8px; font-size: 0.85rem; color: var(--text-secondary); }
.legend span.item { display: flex; align-items: center; gap: 7px; }
.legend .swatch { width: 14px; height: 3px; border-radius: 2px; }

/* ---------- plot ---------- */

.plot { position: relative; width: 100%; }
canvas { display: block; width: 100%; touch-action: pan-y; }
.tooltip {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity .08s;
  background: var(--tooltip-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 0.8rem; line-height: 1.45; white-space: nowrap;
  box-shadow: 0 6px 18px rgba(0,0,0,0.14); z-index: 5; color: var(--text-primary);
}
.tooltip .tdate { color: var(--muted); font-size: 0.74rem; margin-bottom: 3px; }
.tooltip .trow { display: flex; align-items: center; gap: 7px; }
.tooltip .tval { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 14px; font-weight: 600; }

/* ---------- scale bars ---------- */

.scale { margin: 6px 0 14px; }
.scale-row { display: grid; grid-template-columns: minmax(140px, 210px) 1fr auto; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--grid); }
.scale-row:last-child { border-bottom: none; }
.scale-label { font-size: 0.9rem; line-height: 1.3; }
.scale-label small { display: block; font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.scale-track { position: relative; height: 20px; }
.scale-bar {
  position: absolute; inset: 0 auto 0 0; height: 100%; width: var(--w);
  background: var(--c); border-radius: 3px; transform-origin: left center;
  animation: grow 900ms cubic-bezier(.2,.7,.3,1) both; min-width: 2px;
}
.scale-bar[data-hatch="1"] {
  background-image: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 7px);
}
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.scale-val { font-variant-numeric: tabular-nums; font-size: 0.9rem; white-space: nowrap; }

/* Narrow screens: the label and value columns leave the track almost no room,
   so even the largest bar renders as a stub. Stack instead, and let the track
   have the full width. */
@media (max-width: 640px) {
  .scale-row { grid-template-columns: 1fr auto; gap: 4px 12px; }
  .scale-label { grid-column: 1; }
  .scale-val { grid-column: 2; align-self: center; }
  .scale-track { grid-column: 1 / -1; height: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .scale-bar { animation: none; }
  .tooltip { transition: none; }
  * { scroll-behavior: auto; }
}

/* ---------- measures ---------- */

.measures { display: grid; gap: 14px; margin: 14px 0 0; }
@media (min-width: 820px) { .measures { grid-template-columns: repeat(3, 1fr); } }
.measure { background: var(--plane); border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 8px; padding: 14px 16px; }
.measure h3 { margin: 0 0 8px; font-size: 0.92rem; }
.measure .headline { font-variant-numeric: tabular-nums; font-size: 1.9rem; font-weight: 650; line-height: 1; color: var(--c); letter-spacing: -0.02em; }
.measure .headline small { display: block; font-size: 0.74rem; font-weight: 400; color: var(--text-secondary); margin-top: 8px; line-height: 1.45; letter-spacing: 0; }
.measure ul { margin: 14px 0 0; padding: 0; list-style: none; }
.measure li { font-size: 0.84rem; padding: 6px 0; border-top: 1px solid var(--grid); display: flex; justify-content: space-between; gap: 12px; }
.measure li b { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- tables ---------- */

table { border-collapse: collapse; width: 100%; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
td.t, th.t { text-align: left; }
.tablewrap { overflow-x: auto; }
caption { text-align: left; font-size: 0.82rem; color: var(--text-secondary); padding-bottom: 8px; }

details.fallback { margin: 10px 0 0; }
details.fallback summary { font-size: 0.8rem; color: var(--muted); cursor: pointer; }
details.fallback[open] summary { margin-bottom: 8px; }

/* ---------- callouts ---------- */

.caveat { border-left: 4px solid var(--series-2); background: var(--plane); border-radius: 8px; padding: 14px 16px; margin: 16px 0; max-width: 78ch; }
.caveat p { margin: 0 0 10px; font-size: 0.9rem; }
.caveat p:last-child { margin-bottom: 0; }

.prose { font-size: 0.92rem; color: var(--text-secondary); max-width: 78ch; }
.prose b, .prose strong { color: var(--text-primary); }
.note { font-size: 0.78rem; color: var(--muted); max-width: 80ch; margin: 8px 0 0; }

/* Provenance. Every figure states when it was true and where it came from. */
.prov { font-size: 0.72rem; color: var(--muted); }
.prov a { color: inherit; }
.warn {
  color: var(--warn); font-weight: 600; font-size: 0.72rem;
  border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; white-space: nowrap;
}
.chip {
  font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 650;
  border-radius: 3px; padding: 1px 5px; color: var(--surface-1); background: var(--c); white-space: nowrap;
}
.chip[data-hatch="1"] { background-image: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 5px); }

.status { color: var(--text-secondary); font-size: 0.9rem; padding: 40px 0; text-align: center; }
.error { border-left: 4px solid var(--series-2); background: var(--surface-1); border-radius: 8px; padding: 20px 24px; margin: 40px 0; max-width: 70ch; }

/* The hub footer is styled by /shared-footer/footer.css, linked above and
   served by Caddy's shared_footer snippet. Deliberately not restyled here:
   one source of truth means a change to the shared file reaches this page. */
</style>
</head>
<body>

<div class="wrap">

<div class="topbar">
  <header>
    <h1>Debt Atlas</h1>
    <p class="sub">AI capital, sovereign debt and household balance sheets, put on the same axis. Every figure carries the date it was true and the place it came from.</p>
    <p class="statuschip" id="statuschip" hidden></p>
    <p class="stamp num" id="stamp"></p>
  </header>
  <div class="bandctl">
    <span class="lbl">Recession shading</span>
    <button class="seg" data-band="us" type="button" aria-pressed="true">US</button>
    <button class="seg" data-band="ca" type="button" aria-pressed="true">Canada</button>
  </div>
  <button class="theme" id="theme-toggle" type="button" aria-label="Switch colour theme">Theme</button>
</div>

<main id="app">
  <p class="status">Loading the data layer.</p>
</main>

</div>

<footer class="chrislawrence-footer">
  <a href="https://chrislawrence.ca" class="footer-home-link" aria-label="Back to chrislawrence.ca">
    <img src="/shared-footer/logo-portrait.png" alt="Chris Lawrence" class="footer-logo"
         width="32" height="32" loading="lazy" onerror="this.remove()">
    <span class="footer-home-link-text">Back to chrislawrence.ca</span>
  </a>
</footer>

<script>
/* Debt Atlas. No framework, no build step, no package manager: this has to
   still work in three years when nobody has run an install in as long.

   The one rule that governs the whole file: no figure is typed into markup.
   Every number, including every number inside a sentence, is interpolated
   from the data layer. A figure typed into a template is a figure that goes
   stale silently, and silence is the failure mode worth engineering against.

   Build stamp: __BUILD_TIME__ */
(function () {
"use strict";

/* `recessions` is vendored from econ-core, not researched here, but it rides
   the same path as the curated files so its two sources land in the sources
   list automatically: a mark on a chart with no citation cannot exist. */
var FILES = ["meta", "gdp", "federal-debt", "ai-capital", "household-debt", "cycles", "recessions"];
var charts = [];   // every Chart, so resize and theme changes reach all of them
var D = null;      // loaded data layer
var S = null;      // series.json, machine-fetched long series

function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* A CSS hex from the palette at a given alpha. Canvas has no notion of the
   custom properties, so a band colour has to be resolved to rgba() here. */
function rgba(hex, alpha) {
  var h = String(hex).trim().replace("#", "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  if (h.length !== 6) return hex;
  return "rgba(" + parseInt(h.slice(0, 2), 16) + "," + parseInt(h.slice(2, 4), 16) +
    "," + parseInt(h.slice(4, 6), 16) + "," + alpha + ")";
}

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
}

/* ---------------- formatting ---------------- */

function commas(n) { return n.toLocaleString("en-US"); }

function money(v, unit) {
  if (v === null || v === undefined || !isFinite(v)) return "n/a";
  if (unit === "USD_trillions") return "$" + (v >= 10 ? v.toFixed(1) : v.toFixed(2)) + "T";
  if (unit === "CAD_trillions") return "C$" + (v >= 10 ? v.toFixed(1) : v.toFixed(2)) + "T";
  if (unit === "USD_billions") return "$" + (v >= 100 ? commas(Math.round(v)) : v) + "B";
  if (unit === "CAD_billions") return "C$" + commas(Math.round(v)) + "B";
  if (unit === "CAD_billions_per_quarter") return "C$" + v + "B";
  if (unit === "USD_billions_per_month") return "$" + v + "B/month";
  if (unit === "USD_millions") return "$" + (v / 1e6 >= 1 ? (v / 1e6).toFixed(2) + "T" : commas(Math.round(v)) + "M");
  if (unit === "percent" || unit === "percent_of_gdp") return v + "%";
  if (unit === "USD") return "$" + commas(Math.round(v));
  if (unit === "CAD") return "C$" + commas(Math.round(v));
  if (unit === "ratio") return v + "×";
  if (unit === "thousands") return commas(Math.round(v)) + "k";
  if (unit === "thousands_of_persons") return commas(Math.round(v * 1000));
  if (unit === "persons") return commas(Math.round(v));
  return String(v);
}

/* Trillions is the only axis on which the three debt worlds are comparable,
   so billions-denominated figures get converted rather than compared raw. */
function toTrillions(o) {
  if (!o || typeof o.value !== "number") return null;
  var u = o.unit;
  if (u === "USD_trillions") return o.value;
  if (u === "USD_billions") return o.value / 1000;
  if (u === "CAD_trillions") return o.value * fx();
  if (u === "CAD_billions") return o.value / 1000 * fx();
  return null;
}

/* ---------------- the five-field contract ---------------- */

var CONF = { reported: "--c-reported", estimate: "--c-estimate", projection: "--c-projection" };

function confVar(c) { return "var(" + (CONF[c] || "--muted") + ")"; }
function hatched(c) { return c && c !== "reported" ? "1" : "0"; }

/* A value missing as_of or source_url must render a visible warning rather
   than rendering clean. Failing loudly is the whole point: a figure with no
   date attached is a figure nobody can check later. */
function contractGaps(o, container) {
  var missing = [];
  if (!o) return ["no value"];
  // Container objects carry provenance for a group of figures held under their
  // own keys, so they have no single `value` and demanding one would flag them
  // every render. A warning that fires on correct data teaches readers to
  // ignore it, which costs more than the check is worth.
  if (!container && (o.value === null || o.value === undefined)) missing.push("value");
  if (!o.as_of) missing.push("date");
  if (!o.source_url) missing.push("source");
  return missing;
}

function val(o) {
  return o ? esc(money(o.value, o.unit)) : "n/a";
}

function chip(o) {
  if (!o || !o.confidence) return "";
  return '<span class="chip" data-hatch="' + hatched(o.confidence) +
    '" style="--c:' + confVar(o.confidence) + '">' + esc(o.confidence) + "</span>";
}

/* Provenance line: when it was true, where it came from, and, when a machine
   refreshed it, which endpoint actually produced the number now on screen. */
function prov(o, container) {
  if (!o) return "";
  var gaps = contractGaps(o, container);
  var bits = [];
  if (o.as_of) bits.push(esc(o.as_of));
  if (o.source_url) {
    bits.push('<a href="' + esc(o.source_url) + '" rel="noopener">' + esc(o.source || "source") + "</a>");
  } else if (o.source) {
    bits.push(esc(o.source));
  }
  if (o.updated_by && o.updated_by.source_url) {
    bits.push('refreshed from <a href="' + esc(o.updated_by.source_url) + '" rel="noopener">' +
      esc(o.updated_by.source) + "</a> on " + esc(o.updated_by.at));
  }
  var out = '<span class="prov">' + bits.join(" · ") + "</span>";
  if (gaps.length) {
    out += ' <span class="warn" title="This figure is missing ' + esc(gaps.join(" and ")) +
      '. It is shown so the gap is visible rather than hidden.">missing ' + esc(gaps.join(" + ")) + "</span>";
  }
  if (o.disputed) {
    out += ' <span class="warn" title="' + esc(o.disputed) + '">disputed</span>';
  }
  return out;
}

/* Scope is not decoration on these figures. A capex total for four companies
   and one for five differ by tens of billions, and that difference has been
   mistaken for growth often enough that it belongs next to the number. */
function scopeNote(o) {
  return o && o.scope ? '<div class="prov"><b>Scope:</b> ' + esc(o.scope) + "</div>" : "";
}

/* Other bases for the same quantity, where the difference is definitional
   rather than a disagreement about fact. Shown so a reader meeting a different
   number elsewhere can see why it differs instead of assuming one is wrong. */
function alternatives(o) {
  if (!o || !o.alternatives || !o.alternatives.length) return "";
  return '<div class="prov"><b>On other bases:</b><ul style="margin:4px 0 0;padding-left:18px">' +
    o.alternatives.map(function (a) {
      return "<li>" + esc(money(a.value, a.unit)) + " &mdash; " + esc(a.scope) +
        (a.basis ? " " + esc(a.basis) + "." : "") +
        (a.source_url ? ' <a href="' + esc(a.source_url) + '" rel="noopener">' +
          esc(a.source || "source") + "</a>" : esc(a.source ? " " + a.source : "")) + "</li>";
    }).join("") + "</ul></div>";
}

/* ---------------- prose interpolation ---------------- */

/* Sentences state figures by token, never by literal. "{us_gdp} of output"
   renders the current value and cannot drift from it. Tokens resolve against
   the registry built in tokens(); an unknown token renders visibly rather
   than silently vanishing, so a typo surfaces on the page. */
function interp(text) {
  if (!text) return "";
  return esc(text).replace(/\{([a-z0-9_.]+)\}/gi, function (whole, key) {
    var o = T[key];
    if (o === undefined) return '<span class="warn">' + esc(key) + "?</span>";
    if (typeof o === "string") return o;
    return "<b>" + esc(money(o.value, o.unit)) + "</b>";
  });
}

/* ---------------- chart ---------------- */

/* 1-2-2.5-5-10 nice numbers, so an axis lands on readable values. */
function niceTicks(lo, hi, target) {
  var span = hi - lo;
  if (!(span > 0)) return [lo];
  var raw = span / Math.max(1, target);
  var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
  var norm = raw / mag, step;
  if (norm <= 1) step = 1; else if (norm <= 2) step = 2;
  else if (norm <= 2.5) step = 2.5; else if (norm <= 5) step = 5; else step = 10;
  step *= mag;
  var out = [], v = Math.ceil(lo / step) * step;
  for (; v <= hi + step * 0.001; v += step) out.push(Math.round(v / step) * step);
  return out;
}

function Chart(canvasId, tooltipId, opts) {
  this.canvas = document.getElementById(canvasId);
  this.tip = document.getElementById(tooltipId);
  this.opts = opts || {};
  this.hover = null;
  this.xs = [];
  this.series = [];
  // Captured once. canvas.height is a reflected IDL attribute, so assigning
  // cv.height rewrites the attribute the next draw would read back: at
  // devicePixelRatio 3 the logical height went 320 -> 960 -> 2880 on
  // successive redraws. At dpr 1 it is a harmless no-op, which is why this
  // only ever showed up on phones, where every touchmove triggers a redraw
  // and the canvas balloons out of the viewport on first contact.
  this.logicalHeight = parseInt(this.canvas.getAttribute("height"), 10) || 300;
  var self = this;
  this.canvas.addEventListener("mousemove", function (e) { self.onMove(e.clientX); });
  this.canvas.addEventListener("mouseleave", function () { self.clearHover(); });
  this.canvas.addEventListener("touchmove", function (e) {
    if (e.touches[0]) self.onMove(e.touches[0].clientX);
  }, { passive: true });
  this.canvas.addEventListener("touchend", function () { self.clearHover(); });
  charts.push(this);
}

Chart.prototype.clearHover = function () {
  this.hover = null;
  this.tip.style.opacity = 0;
  this.draw();
};

Chart.prototype.setData = function (xs, series, bands) {
  this.xs = xs || [];
  this.series = series || [];
  this.bands = bands || [];
  this.hover = null;
  this.draw();
};

Chart.prototype.draw = function () {
  var cv = this.canvas, ctx = cv.getContext("2d");
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth, h = this.logicalHeight;
  if (!w) return;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!this.xs.length || !this.series.length) return;

  var muted = css("--muted"), grid = css("--grid"), axis = css("--axis"), surface = css("--surface-1");
  // A 62px gutter is a sixth of a phone screen. Narrow it below 480 so the
  // plot itself gets the width.
  var padL = this.opts.padLeft || 54;
  var pad = { l: w < 480 ? Math.min(padL, 40) : padL, r: 14, t: 12, b: 28 };
  var g = { left: pad.l, right: w - pad.r, top: pad.t, bottom: h - pad.b };
  this.geom = g;

  var i, j, v, lo = Infinity, hi = -Infinity;
  for (i = 0; i < this.series.length; i++) {
    for (j = 0; j < this.series[i].values.length; j++) {
      v = this.series[i].values[j];
      if (v === null || !isFinite(v)) continue;
      if (v < lo) lo = v; if (v > hi) hi = v;
    }
  }
  var refs = this.opts.refs || [];
  for (i = 0; i < refs.length; i++) { if (refs[i].y > hi) hi = refs[i].y; if (refs[i].y < lo) lo = refs[i].y; }
  if (!isFinite(lo)) return;
  if (this.opts.includeZero !== false) lo = Math.min(0, lo);
  var padY = (hi - lo) * 0.08 || 1;
  hi += padY; if (lo < 0 || this.opts.includeZero === false) lo -= padY;

  var X = function (k) {
    return g.left + (k / Math.max(1, this.xs.length - 1)) * (g.right - g.left);
  }.bind(this);
  var Y = function (val) { return g.bottom - ((val - lo) / (hi - lo)) * (g.bottom - g.top); };
  var unit = this.opts.unit;

  // Recession bands first, so every other mark sits on top of them. A band is
  // context for the line, never something drawn over it.
  var bands = this.bands || [];
  for (i = 0; i < bands.length; i++) {
    var bx0 = X(bands[i].start), bx1 = X(bands[i].end);
    ctx.fillStyle = bands[i].fill;
    ctx.fillRect(bx0, g.top, Math.max(1, bx1 - bx0), g.bottom - g.top);
  }

  // y grid
  ctx.font = "11px system-ui, sans-serif";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  var ticks = niceTicks(lo, hi, 5);
  for (i = 0; i < ticks.length; i++) {
    var yy = Math.round(Y(ticks[i])) + 0.5;
    ctx.strokeStyle = grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(g.left, yy); ctx.lineTo(g.right, yy); ctx.stroke();
    ctx.fillStyle = muted;
    ctx.fillText(money(ticks[i], unit), g.left - 8, yy);
  }

  // reference lines, e.g. the 1946 wartime peak
  for (i = 0; i < refs.length; i++) {
    var ry = Math.round(Y(refs[i].y)) + 0.5;
    ctx.strokeStyle = refs[i].color || css("--series-2");
    ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(g.left, ry); ctx.lineTo(g.right, ry); ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = "right"; ctx.fillStyle = refs[i].color || css("--series-2");
    ctx.fillText(refs[i].label, g.right - 4, ry - 8);
  }

  // x ticks
  ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillStyle = muted;
  var every = Math.max(1, Math.round(this.xs.length / (w > 700 ? 10 : 5)));
  for (i = 0; i < this.xs.length; i += every) {
    // Only an ISO date gets trimmed to its year. Blanket truncation turned the
    // categorical axis on the buildout chart into "Year Year Year Year".
    var lab = String(this.xs[i]);
    if (/^\d{4}-\d{2}/.test(lab)) lab = lab.slice(0, 4);
    // Keep the first and last labels inside the canvas instead of letting
    // them hang off the edge and get clipped.
    var lx = X(i);
    ctx.textAlign = lx > g.right - 24 ? "right" : (lx < g.left + 16 ? "left" : "center");
    ctx.fillText(lab, Math.min(Math.max(lx, g.left), g.right), g.bottom + 6);
  }
  ctx.strokeStyle = axis; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(g.left, Math.round(g.bottom) + 0.5); ctx.lineTo(g.right, Math.round(g.bottom) + 0.5); ctx.stroke();

  // series
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  for (i = 0; i < this.series.length; i++) {
    var s = this.series[i];
    if (s.bars) {
      var bw = Math.max(2, (g.right - g.left) / this.xs.length * 0.6);
      ctx.fillStyle = s.color;
      for (j = 0; j < s.values.length; j++) {
        v = s.values[j];
        if (v === null || !isFinite(v)) continue;
        ctx.fillRect(X(j) - bw / 2, Y(v), bw, Y(Math.max(0, lo)) - Y(v));
      }
      continue;
    }
    ctx.strokeStyle = s.color; ctx.lineWidth = 2;
    if (s.dashed) ctx.setLineDash([5, 4]);
    ctx.beginPath();
    var pen = false;
    for (j = 0; j < s.values.length; j++) {
      v = s.values[j];
      // A gap stays a gap. Bridging nulls invents observations.
      if (v === null || !isFinite(v)) { pen = false; continue; }
      var xx = X(j), yy2 = Y(v);
      if (!pen) { ctx.moveTo(xx, yy2); pen = true; } else { ctx.lineTo(xx, yy2); }
    }
    ctx.stroke();
    ctx.setLineDash([]);
    if (s.dots) {
      for (j = 0; j < s.values.length; j++) {
        v = s.values[j];
        if (v === null || !isFinite(v)) continue;
        ctx.fillStyle = s.color;
        ctx.beginPath(); ctx.arc(X(j), Y(v), 3, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // crosshair
  if (this.hover !== null && this.hover < this.xs.length) {
    var hx = Math.round(X(this.hover)) + 0.5;
    ctx.strokeStyle = axis; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(hx, g.top); ctx.lineTo(hx, g.bottom); ctx.stroke();
    ctx.setLineDash([]);
    for (i = 0; i < this.series.length; i++) {
      v = this.series[i].values[this.hover];
      if (v === null || !isFinite(v)) continue;
      ctx.fillStyle = this.series[i].color;
      ctx.beginPath(); ctx.arc(X(this.hover), Y(v), 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = surface; ctx.lineWidth = 2; ctx.stroke();
    }
  }
};

Chart.prototype.onMove = function (clientX) {
  if (!this.geom || !this.xs.length) return;
  var rect = this.canvas.getBoundingClientRect();
  var g = this.geom;
  var frac = (clientX - rect.left - g.left) / (g.right - g.left);
  var idx = Math.round(frac * (this.xs.length - 1));
  idx = Math.max(0, Math.min(this.xs.length - 1, idx));
  if (idx === this.hover) return;
  this.hover = idx;
  this.draw();
  this.showTip(idx, rect);
};

Chart.prototype.showTip = function (idx, rect) {
  var html = '<div class="tdate">' + esc(this.xs[idx]) + "</div>", i, s, v;
  for (i = 0; i < this.series.length; i++) {
    s = this.series[i]; v = s.values[idx];
    html += '<div class="trow"><span class="swatch" style="background:' + s.color + '"></span>' +
      esc(s.name) + '<span class="tval">' +
      (v === null || !isFinite(v) ? "no data" : esc(money(v, this.opts.unit))) + "</span></div>";
  }
  this.tip.innerHTML = html;
  this.tip.style.opacity = 1;
  var g = this.geom;
  var px = g.left + (idx / Math.max(1, this.xs.length - 1)) * (g.right - g.left);
  var tw = this.tip.offsetWidth;
  var left = px + 14;
  if (left + tw > rect.width - 4) left = px - tw - 14;
  if (left < 4) left = 4;
  this.tip.style.left = left + "px";
  this.tip.style.top = "14px";
};

/* Every chart is in the registry, so resize and theme changes reach all of

function daysSince(iso) {
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso + "T00:00:00Z").getTime()) / 86400000);
}

function stampLine() {
  var bits = ["Built " + esc(D.meta.built), "schema " + esc(D.meta.schema_version)];
  if (S && S.fetched_at) bits.push("series refreshed " + esc(S.fetched_at.slice(0, 10)));
  var limit = (D.meta.staleness && D.meta.staleness.manual_review_days) || 90;
  var age = daysSince(D["ai-capital"].last_reviewed);
  if (age !== null) {
    var txt = "AI figures reviewed by hand " + age + " days ago";
    bits.push(age > limit ? '<span class="stale">' + txt + ", past the " + limit + "-day mark</span>" : txt);
  }
  return bits.join(" · ");
}

function tile(label, o, note) {
  // The tile row exists to be compared across, so a billions-denominated
  // figure sitting beside trillions is shown on the same axis. The provenance
  // line still carries the value as its source states it.
  // Stays inside its own currency: converting a Canadian figure to US dollars
  // here would change what the number means without the label saying so.
  var shown = val(o);
  if (o && (o.unit === "USD_billions" || o.unit === "CAD_billions") && o.value >= 1000) {
    shown = money(o.value / 1000, o.unit === "USD_billions" ? "USD_trillions" : "CAD_trillions");
  }
  return '<div class="tile"><div class="label"><span class="swatch" style="background:' +
    confVar(o && o.confidence) + '"></span>' + esc(label) + "</div>" +
    '<div class="value num">' + shown + "</div>" +
    '<div class="note">' + esc(note || "") + "</div>" +
    '<div class="note">' + prov(o) + "</div></div>";
}

function seriesRows(hist) {
  // Union of years across the sub-series, so a gap in one stays a gap.
  var years = {}, i, j;
  hist.series.forEach(function (s) {
    s.points.forEach(function (p) { years[p.year] = 1; });
  });
  var xs = Object.keys(years).map(Number).sort(function (a, b) { return a - b; });
  var out = hist.series.map(function (s) {
    var by = {};
    s.points.forEach(function (p) { by[p.year] = p.value; });
    return { id: s.id, name: s.label, scope: s.scope, values: xs.map(function (y) {
      return by[y] === undefined ? null : by[y]; }) };
  });
  return { xs: xs, series: out };
}

/* Align several FRED series onto one date axis. Dates present in one series
   and not another yield null there, which the renderer leaves as a gap. */
function align(ids) {
  var dates = {};
  ids.forEach(function (id) {
    var s = S.series[id];
    if (s) s.obs.forEach(function (o) { dates[o[0]] = 1; });
  });
  var xs = Object.keys(dates).sort();
  var out = ids.map(function (id) {
    var s = S.series[id], by = {};
    if (s) s.obs.forEach(function (o) { by[o[0]] = o[1]; });
    return { id: id, name: s ? s.label : id, values: xs.map(function (d) {
      return by[d] === undefined ? null : by[d]; }) };
  });
  return { xs: xs, series: out };
}

/* {year: value} from a contract series, taking the highest reading in each
   year. Used where an annual figure is compared against a quarterly series. */
function byYear(entry) {
  var out = {};
  if (entry) entry.obs.forEach(function (o) {
    var y = +o[0].slice(0, 4);
    out[y] = Math.max(out[y] === undefined ? -Infinity : out[y], o[1]);
  });
  return out;
}

/* 7. What changed, and how the page is kept true */

function changedSection(log) {
  var rows = "";
  if (log && log.recent && log.recent.length) {
    rows = log.recent.filter(function (r) {
      return r.action === "written" || r.action === "blocked" ||
             r.action === "stale-upstream" || r.action === "revised";
    }).slice(0, 12).map(function (r) {
      // Two record shapes share one log. A curated record names a single
      // figure and carries one before/after; a series record names a long
      // series and carries a sample of the observations upstream restated.
      // The suffix matters because the two namespaces overlap deliberately:
      // us_gdp_nominal is both a curated figure and a series.
      if (r.action === "revised" && r.series) {
        var s0 = (r.sample && r.sample[0]) || {};
        return "<tr><td>" + esc(r.series) + " <span class=\"muted\">(series)</span></td><td>" +
          (s0.before === undefined ? "" : esc(String(s0.before))) + "</td><td>" +
          (s0.after === undefined ? "" : esc(String(s0.after))) + "</td><td>" +
          esc((r.span && r.span[1]) || "") + '</td><td class="t">revised. ' +
          esc(r.changed + " observation" + (r.changed === 1 ? "" : "s") +
              " restated, largest move " + r.max_delta) + "</td></tr>";
      }
      return "<tr><td>" + esc(r.label || r.key) + "</td><td>" +
        (r.before === undefined ? "" : esc(String(r.before))) + "</td><td>" +
        (r.after === undefined ? "" : esc(String(r.after))) + "</td><td>" +
        esc(r.as_of_after || "") + '</td><td class="t">' + esc(r.action) +
        (r.reason ? ". " + esc(r.reason) : "") + "</td></tr>";
    }).join("");
  }
  if (!rows) rows = '<tr><td class="t" colspan="5">Nothing has changed since the log began.</td></tr>';

  return '<section><h2>What changed</h2>' +
    '<p class="standfirst">The sovereign figures barely move and the AI figures move fast. Showing the ' +
    'changes side by side makes that difference in tempo legible, which a snapshot cannot.</p>' +
    '<div class="card"><div class="tablewrap"><table><thead><tr><th class="t">Figure</th><th>Before</th>' +
    '<th>After</th><th>As of</th><th class="t">Outcome</th></tr></thead><tbody>' + rows +
    "</tbody></table></div>" +
    '<p class="note">A refresh that would move a figure by more than ' +
    esc(String(D.meta.updater.max_change_percent)) + ' percent is logged and refused rather than written, ' +
    'because these series do not move that fast: a jump that large means an endpoint changed, not that the ' +
    'world did. A refresh that would drag a date backwards is refused too. The updater can only change ' +
    "figures that already exist; adding one is a human decision.</p>" +
    '<p class="note">Rows marked <em>series</em> come from the other half of the log. The long series ' +
    'are rewritten wholesale on every run, so each run is diffed against the one before it and any ' +
    'already-published observation that upstream has since restated is recorded here. A revision is ' +
    'not a new reading at the end of the series; it is history changing underneath a number this page ' +
    "had already shown.</p></div>" +

    '<div class="card"><h2>Sources and method</h2>' +
    '<p class="prose">Federal debt comes from the US Treasury and the St Louis Fed. GDP, corporate debt, ' +
    'household debt on the comparable basis, debt service and population come from the Federal Reserve, the ' +
    'Bureau of Economic Analysis, the Bank for International Settlements and the World Bank. Canadian ' +
    'household figures come from Statistics Canada. Those refresh on a schedule.</p>' +
    '<p class="prose">The AI figures do not, and cannot. They come from securities filings, ratings agency ' +
    'notes and press reporting, and they need something that can read rather than something that can poll. ' +
    'The date at the top says when a person last went through them. Where sources disagree, both are shown ' +
    'rather than one being chosen to make a table tidier.</p>' +
    '<p class="prose">Every figure carries the date it was true and a link to where it came from. A figure ' +
    'missing either is marked on the page rather than quietly rendered as though it were complete.</p>' +
    '<p class="note">' + esc(D["ai-capital"].ai_native_companies.companies.filter(function (c) {
      return c.name === "Anthropic"; })[0].disclosure) + "</p></div></section>";
}

/* 7c. Where sources disagree
 *
 * Walks the data for `disputed` fields the same way collectSources walks it
 * for source_url. Before this, five disputes were recorded and only two
 * reached the page: one sat on a figure that renders nowhere, another inside a
 * history array whose points render as a chart line with no room for a note.
 * A dispute recorded in a file nobody reads is not a disclosure. Deriving the
 * list from the data makes an invisible dispute impossible to create. */

function collectDisputes(node, path, out, depth) {
  if (!node || depth > 8) return out;
  if (Array.isArray(node)) {
    node.forEach(function (v, i) { collectDisputes(v, path, out, depth + 1); });
    return out;
  }
  if (typeof node !== "object") return out;
  if (node.disputed) {
    out.push({
      label: node.label || node.name || (node.year ? "Year " + node.year : "") || path,
      value: (node.value !== undefined && node.unit) ? money(node.value, node.unit) :
             (node.value !== undefined ? String(node.value) : ""),
      as_of: node.as_of || node.period || (node.year ? String(node.year) : ""),
      text: node.disputed,
      source: node.source, source_url: node.source_url
    });
  }
  Object.keys(node).forEach(function (k) { collectDisputes(node[k], k, out, depth + 1); });
  return out;
}

function disputesSection() {
  var found = [];
  FILES.forEach(function (f) { collectDisputes(D[f], f, found, 0); });
  if (!found.length) return "";

  var rows = found.map(function (d) {
    return "<li><b>" + esc(d.label) + "</b>" +
      (d.value ? ' <span class="num">' + esc(d.value) + "</span>" : "") +
      (d.as_of ? ' <span class="prov">' + esc(d.as_of) + "</span>" : "") +
      "<br>" + esc(d.text) +
      (d.source_url ? ' <a href="' + esc(d.source_url) + '" rel="noopener">' +
        esc(d.source || "source") + "</a>" : "") + "</li>";
  }).join("");

  return '<section><h2>Where sources disagree</h2>' +
    '<p class="standfirst">Every figure on this page that is contested, in one place. These are not ' +
    'defects to be tidied away: on this subject the disagreements are often the most useful content, ' +
    'because they show where a number depends on who is counting and what they chose to count.</p>' +
    '<div class="card"><div class="prose"><ul>' + rows + "</ul>" +
    '<p class="note">' + found.length + " contested " + (found.length === 1 ? "figure" : "figures") +
    ", collected from the data rather than written by hand, so a dispute cannot be recorded without " +
    "appearing here. Where a figure is disputed it keeps its stored value and carries the disagreement " +
    "alongside; nothing is silently overwritten.</p></div></div></section>";
}

/* 8. Sources
 *
 * Generated by walking the data layer, not hand-written. A typed list is
 * markup that goes stale silently, and it drifts from the figures it claims
 * to cover: diesel keeps its list in the page while its server ships a
 * parallel copy the page never reads. Building it from the values makes the
 * guarantee structural. A figure whose source is absent from this list cannot
 * exist, because the list is derived from the figures. */

function collectSources(node, out, depth) {
  if (!node || depth > 8) return out;
  if (Array.isArray(node)) {
    node.forEach(function (v) { collectSources(v, out, depth + 1); });
    return out;
  }
  if (typeof node !== "object") return out;

  if (node.source_url && typeof node.source_url === "string") {
    var key = node.source_url;
    if (!out[key]) out[key] = { url: key, names: {}, series: {} };
    if (node.source) out[key].names[node.source] = 1;
  }
  if (node.updated_by && node.updated_by.source_url) {
    var k2 = node.updated_by.source_url;
    if (!out[k2]) out[k2] = { url: k2, names: {}, series: {} };
    if (node.updated_by.source) out[k2].names[node.updated_by.source] = 1;
  }
  Object.keys(node).forEach(function (k) {
    if (k === "updated_by") return;
    collectSources(node[k], out, depth + 1);
  });
  return out;
}

function publisherOf(url) {
  var host = url.replace(/^https?:\/\//, "").split("/")[0].replace(/^www\./, "");
  var known = {
    "fred.stlouisfed.org": "Federal Reserve Bank of St Louis (FRED)",
    "fiscaldata.treasury.gov": "US Treasury, Fiscal Data",
    "newyorkfed.org": "Federal Reserve Bank of New York",
    "www150.statcan.gc.ca": "Statistics Canada",
    "bis.org": "Bank for International Settlements",
    "cbo.gov": "Congressional Budget Office",
    "budgetmodel.wharton.upenn.edu": "Penn Wharton Budget Model",
    "am.jpmorgan.com": "J.P. Morgan Asset Management",
    "chicagobooth.edu": "Chicago Booth Review",
    "quinnemanuel.com": "Quinn Emanuel",
    "sec.gov": "SEC filings",
    "data.sec.gov": "SEC XBRL company facts",
    "epoch.ai": "Epoch AI",
    "mufgamericas.com": "MUFG Capital Markets Strategy",
    "iese.edu": "IESE Business School",
    "fortune.com": "Fortune, reporting Moody's Ratings"
  };
  return known[host] || host;
}

/* Two URLs for one page, e.g. a publisher serving both a dated and an undated
   path, would otherwise list the same article twice. Fold them on host plus
   final path segment and keep the shortest, which is the canonical form in
   every case seen here and the one a publisher's own canonical tag points at.
   Deliberately narrow: differing final segments stay separate, so a FRED
   series page and a data file, or a landing page and its PDF, are untouched. */
function dedupeSources(found) {
  var byKey = {}, out = {};
  Object.keys(found).forEach(function (url) {
    var rest = url.split("//").pop();
    var host = rest.split("/")[0].replace(/^www\./, "");
    var segs = rest.split("/").slice(1).filter(Boolean);
    var key = host + "|" + (segs.length ? segs[segs.length - 1] : "");
    if (!byKey[key] || url.length < byKey[key].length) byKey[key] = url;
  });
  Object.keys(byKey).forEach(function (key) { out[byKey[key]] = { url: byKey[key], names: {}, series: {} }; });
  // Merge every variant's names onto the survivor so no attribution is lost.
  Object.keys(found).forEach(function (url) {
    var rest = url.split("//").pop();
    var host = rest.split("/")[0].replace(/^www\./, "");
    var segs = rest.split("/").slice(1).filter(Boolean);
    var keep = byKey[host + "|" + (segs.length ? segs[segs.length - 1] : "")];
    Object.keys(found[url].names).forEach(function (n) { out[keep].names[n] = 1; });
  });
  return out;
}

function sourcesSection() {
  var found = {};
  FILES.forEach(function (f) { collectSources(D[f], found, 0); });
  if (S && S.series) collectSources(S.series, found, 0);
  if (S && S.derived) collectSources(S.derived, found, 0);
  found = dedupeSources(found);

  // Series are keyed by contract id, but this list groups by the FRED mnemonic
  // parsed back out of the source URL. Index the series by their own upstream
  // id so the label and note still resolve: the ids stopped matching when the
  // series moved onto the shared contract, and a plain S.series[fredId] lookup
  // would return undefined and drop every annotation without erroring.
  var byFredId = {};
  Object.keys((S && S.series) || {}).forEach(function (k) {
    var mm = String(S.series[k].source_url || "").match(/fred\.stlouisfed\.org\/series\/([A-Z0-9]+)/);
    if (mm) byFredId[mm[1]] = S.series[k];
  });

  // Group by publisher, and fold the FRED series into one entry rather than
  // listing fourteen near-identical URLs.
  var groups = {};
  Object.keys(found).forEach(function (url) {
    // Prefer a mapped institution name, then the name the data itself gives
    // the source, and only fall back to a bare hostname when neither exists.
    var names = Object.keys(found[url].names);
    var pub = publisherOf(url);
    if (pub === url.replace(/^https?:\/\//, "").split("/")[0].replace(/^www\./, "") && names.length) {
      pub = names[0];
    }
    if (!groups[pub]) groups[pub] = { entries: [], fred: [] };
    var m = url.match(/fred\.stlouisfed\.org\/series\/([A-Z0-9]+)/);
    if (m) groups[pub].fred.push({ id: m[1], url: url, entry: byFredId[m[1]], names: names });
    else groups[pub].entries.push({ url: url, names: Object.keys(found[url].names) });
  });

  var names = Object.keys(groups).sort();
  var items = names.map(function (pub) {
    var g = groups[pub], inner = "";
    if (g.fred.length) {
      g.fred.sort(function (a, b) { return a.id < b.id ? -1 : 1; });
      inner += "<ul>" + g.fred.map(function (s) {
        // Not every FRED URL on the page belongs to one of this app's series:
        // the CAD/USD rate and the recession source are cited by the curated
        // and vendored files. Those fall back to the name the citing data gives
        // them rather than rendering as a bare mnemonic.
        var label = (s.entry && s.entry.label) || s.names[0] || "";
        var note = (s.entry && s.entry.note) || "";
        return '<li><a href="' + esc(s.url) + '" rel="noopener"><code>' + esc(s.id) + "</code></a>" +
          (label ? " " + esc(label) : "") + (note ? ". " + esc(note) : "") + "</li>";
      }).join("") + "</ul>";
    }
    if (g.entries.length) {
      inner += "<ul>" + g.entries.map(function (e) {
        // A URL with no name attached still gets a readable label rather than
        // being printed raw, which wraps badly and reads as an oversight.
        var label = e.names[0];
        if (!label) {
          var tail = e.url.split("/").filter(Boolean).pop() || "";
          label = pub + (tail && tail.indexOf(".") > -1 ? ", " + tail : "");
        }
        return '<li><a href="' + esc(e.url) + '" rel="noopener">' + esc(label) + "</a></li>";
      }).join("") + "</ul>";
    }
    // When the publisher name came from the source itself and it has a single
    // entry, the heading and its nested link are the same words twice. Render
    // the heading as the link instead.
    if (!g.fred.length && g.entries.length === 1 && g.entries[0].names[0] === pub) {
      return '<li><strong><a href="' + esc(g.entries[0].url) + '" rel="noopener">' +
        esc(pub) + "</a></strong></li>";
    }
    return "<li><strong>" + esc(pub) + "</strong>" + inner + "</li>";
  }).join("");

  var count = Object.keys(found).length;

  return '<section><h2>Sources</h2>' +
    '<p class="standfirst">Every distinct source behind every figure on this page, built from ' +
    'the data itself. Nothing renders that is not listed here.</p>' +
    '<div class="card"><div class="prose">' +
    "<p>" + count + " distinct sources across " + Object.keys(S.series || {}).length +
    " machine-refreshed series and the curated figures.</p>" +
    "<ul>" + items + "</ul>" +

    "<h3>Notes on the series</h3><ul>" +
    "<li><strong>Stock against flow.</strong> Debt is a balance owed at a moment; GDP is output " +
    "over a year. The scale comparison at the top divides one by the other to give a sense of " +
    "magnitude, and that is all it is. It is not a solvency ratio and should never be quoted as " +
    "one.</li>" +
    "<li><strong>Two household bases.</strong> The US and Canadian headline figures come from " +
    "structurally different collections: a credit bureau panel on one side, national accounts on " +
    "the other. The chart uses the BIS pair instead, which puts both countries on one " +
    "methodology. The two bases disagree, and both are shown rather than one being chosen.</li>" +
    "<li><strong>Why measure C is not a line.</strong> Every sourced value for off-balance-sheet " +
    "obligations falls inside a nine-month window, yet they span a factor of four and a half. " +
    "Bank of America and Nikkei cover the identical five companies one month apart and differ by " +
    "39 percent, which rules out both elapsed time and company count. The variation is " +
    "definitional, so the values are ordered by definitional breadth rather than by date.</li>" +
    "<li><strong>Recession shading.</strong> US bands are derived mechanically from NBER dates via " +
    'FRED USREC: the peak month through the trough month, inclusive. Canadian bands are the ' +
    "C.D. Howe Institute Business Cycle Council chronology, which has no API and is curated with " +
    "citations. Both come from one dataset shared by every site in this collection, so two pages " +
    "cannot disagree about when a recession was. On a quarterly axis a band edge is interpolated " +
    "between the observations either side of it rather than snapped to one, so a two-month " +
    "recession is not widened into a quarter.</li>" +
    "<li><strong>Two definitions of federal debt.</strong> Total public debt outstanding includes " +
    "money the government owes itself; debt held by the public does not. They differ by more " +
    "than 20 points of GDP. Both are charted.</li>" +
    "<li><strong>What refreshes and what does not.</strong> Treasury, FRED and the BIS series " +
    "refresh on a schedule. The AI capital figures come from securities filings, ratings notes " +
    "and press reporting, and are reviewed by hand; the date at the top of the page says when. " +
    "Statistics Canada stays manual because guessing a vector identifier returns a plausible " +
    "wrong number, which is worse than an obvious gap.</li>" +
    "<li><strong>Currency.</strong> Canadian figures shown on a common axis are converted at the " +
    "rate stated beside them. A five percent move in the Canadian dollar shifts those bars more " +
    "than a year of real growth does.</li>" +
    "</ul></div></div></section>";
}

var state = { mflip: "abs", fed: "both", hh: "gdp", corp: "level",
              bands: { us: true, ca: true } };

/* ---------------- recession bands ----------------

   The shared dataset (econ-core, vendored) dates bands to the month:
   {"peak": "YYYY-MM", "trough": "YYYY-MM"}, shaded peak month through trough
   month inclusive. These charts plot by array index rather than on a time
   scale, so a month boundary has to be interpolated between the two
   observations that bracket it. Snapping to the nearest observation instead
   would round a two-month recession up to a whole quarter on the quarterly
   series, which is most of them. */

function monthNum(ym) { return +ym.slice(0, 4) * 12 + (+ym.slice(5, 7) - 1); }

/* Month position of an ISO date, with the day carried as a fraction so the
   interpolation is monotonic within a month. */
function dateMonth(iso) {
  return monthNum(iso) + ((+iso.slice(8, 10) || 1) - 1) / 31;
}

/* Fractional index where `target` falls in an ascending numeric array.
   Clamped, so a band wholly outside the axis collapses to zero width and is
   dropped by the caller rather than drawn at the edge. */
function fractionalIndex(vals, target) {
  var n = vals.length;
  if (!n) return 0;
  if (target <= vals[0]) return 0;
  if (target >= vals[n - 1]) return n - 1;
  var lo = 0, hi = n - 1;
  while (hi - lo > 1) {
    var mid = (lo + hi) >> 1;
    if (vals[mid] <= target) lo = mid; else hi = mid;
  }
  var span = vals[hi] - vals[lo];
  return span ? lo + (target - vals[lo]) / span : lo;
}

/* Bands for one chart, as fractional index ranges over its own x axis.
   `which` names the countries this chart can show. */
function bandsFor(xs, which) {
  var out = [];
  if (!D || !D.recessions || !xs || !xs.length) return out;
  // Only a dated axis gets bands. The buildout chart's axis is "Year 0".."Year 7",
  // where a calendar recession has no meaning.
  if (!/^\d{4}-\d{2}/.test(String(xs[0]))) return out;
  var vals = xs.map(dateMonth);
  var alpha = parseFloat(css("--band-alpha")) || 0.09;
  [{ key: "us", set: D.recessions.us, varName: "--series-1" },
   { key: "ca", set: D.recessions.ca, varName: "--series-2" }].forEach(function (d) {
    if (which.indexOf(d.key) === -1 || !d.set || !state.bands[d.key]) return;
    var fill = rgba(css(d.varName), alpha);
    d.set.bands.forEach(function (b) {
      // Trough month inclusive, so the band ends at the start of the month after it.
      var s = fractionalIndex(vals, monthNum(b.peak));
      var e = fractionalIndex(vals, monthNum(b.trough) + 1);
      if (e > s) out.push({ start: s, end: e, fill: fill });
    });
  });
  return out;
}

    var pt = capex.filter(function (p) { return p.year === base + i; })[0];
    var gg = gdpByYear[base + i];   // trillions; capex points are billions
    aiV.push(pt && gg ? +(pt.value / (gg * 1000) * 100).toFixed(2) : null);
  }
  // The telecom side is published as a peak range, not a trajectory. Drawing
  // it as a line needed intermediate years nobody published, so it is a
  // reference band instead: the thing actually being compared against is the
  // height it reached, not the path it took.
  cCyc.opts.refs = [
    { y: tr[0], label: "Telecom peak, " + tr[0] + " to " + tr[1] + "% of GDP", color: css("--series-4") },
    { y: tr[1], label: "", color: css("--series-4") }
  ];
  var out = [
    { name: "AI buildout, capex as % of US GDP", color: css("--series-2"), dots: true, values: aiV }
  ];
  cCyc.opts.unit = "percent";
  legend("lg-cyc", out);
  cCyc.setData(xs, out);
}

function drawCorp() {
  var out, xs;
  if (state.corp === "gdp") {
    // Both legs arrive in trillions, converted at fetch time, so the ratio is
    // a straight division. This used to carry a /1000 to reconcile millions
    // against billions in the renderer, which is exactly the arithmetic the
    // series contract moves upstream.
    var r = align(["us_nonfinancial_corporate_debt", "us_gdp_nominal"]);
    xs = r.xs;
    var debt = r.series[0].values, gdp = r.series[1].values;
    out = [{ name: "Corporate debt as % of GDP", color: css("--series-3"),
      values: xs.map(function (d, i) {
        if (debt[i] === null || gdp[i] === null || !gdp[i]) return null;
        return +(debt[i] / gdp[i] * 100).toFixed(2);
      }) }];
    cCorp.opts.unit = "percent";
    cCorp.opts.includeZero = false;
  } else {
    var s = S.series.us_nonfinancial_corporate_debt;
    // Guarded: this is the one draw path with no null-safe fallback, so a
    // missing series here would throw inside render() and the catch would
    // replace the whole page with the load-failure box.
    if (!s) return;
    xs = s.obs.map(function (o) { return o[0]; });
    out = [{ name: s.label, color: css("--series-3"),
      values: s.obs.map(function (o) { return +o[1].toFixed(3); }) }];
    cCorp.opts.unit = "USD_trillions";
    cCorp.opts.includeZero = true;
  }
  legend("lg-corp", out);
  cCorp.setData(xs, out, bandsFor(xs, ["us"]));
}

function seg(attr, key, fn) {
  document.querySelectorAll("[data-" + attr + "]").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("[data-" + attr + "]").forEach(function (o) {
        o.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      state[key] = b.getAttribute("data-" + attr);
      fn();
    });
  });
}

/* Independent toggles, not a segmented choice, so this cannot use seg(): both
   countries can be on at once and either can be off. The control lives in the
   header rather than in a chart, because one setting drives all three banded
   charts and a per-chart control would imply otherwise. */
function initBands() {
  document.querySelectorAll("[data-band]").forEach(function (b) {
    b.addEventListener("click", function () {
      var key = b.getAttribute("data-band");
      state.bands[key] = !state.bands[key];
      b.setAttribute("aria-pressed", state.bands[key] ? "true" : "false");
      if (D) redrawSeriesColours();
    });
  });
}

function initTheme() {
  var btn = document.getElementById("theme-toggle");
  var saved = null;
  try { saved = localStorage.getItem("debt-theme"); } catch (e) { saved = null; }
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  btn.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    if (!cur) {
      cur = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("debt-theme", next); } catch (e) { /* private mode */ }
    redrawSeriesColours();
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function () { redrawSeriesColours(); };
    if (mq.addEventListener) mq.addEventListener("change", onChange); else mq.addListener(onChange);
  }
}

/* Series colours are resolved from CSS variables when the data is set, so a
   theme flip has to re-run the builders, not just redraw with stale colours. */
function redrawSeriesColours() { drawMeasures(); drawFed(); drawHh(); drawCyc(); drawCorp(); }

/* The one-line state the hub reads, rendered from analysis.status.headline
   rather than recomputed here: the server owns the rule, the page owns the
   pill. Lives in the header, so render() replacing #app leaves it alone. */
function buildChip() {
  var head = ((S.analysis || {}).status || {}).headline;
  var chip = document.getElementById("statuschip");
  if (!head) return;
  chip.innerHTML = '<span class="dot"></span><span><b>' + esc(head.label) +
                   "</b> · " + esc(head.detail) + "</span>";
  chip.setAttribute("data-state", head.state);
  chip.title = head.rule || "";
  chip.hidden = false;
}

function render(log) {
  T = tokens();
  document.getElementById("stamp").innerHTML = stampLine();
  buildChip();
  document.getElementById("app").innerHTML =
    tiles() + heroScale() + measuresSection() + companiesSection() +
    federalSection() + householdsSection() + cyclesSection() + corporateSection() + changedSection(log) + disputesSection() +
    sourcesSection();

  cMeasures = new Chart("c-measures", "t-measures", { unit: "USD_billions", padLeft: 62 });
  cFed = new Chart("c-fed", "t-fed", { unit: "percent", includeZero: false, padLeft: 48 });
  cHh = new Chart("c-hh", "t-hh", { unit: "percent", includeZero: false, padLeft: 48 });
  cCyc = new Chart("c-cyc", "t-cyc", { unit: "percent", padLeft: 48 });
  cCorp = new Chart("c-corp", "t-corp", { unit: "USD_trillions", padLeft: 56 });

  seg("mflip", "mflip", drawMeasures);
  seg("fed", "fed", drawFed);
  seg("hh", "hh", drawHh);
  seg("corp", "corp", drawCorp);
  redrawSeriesColours();
}

function load() {
  var app = document.getElementById("app");
  // One composed payload rather than seven static files, so there is a single
  // definition of what the page consumes and the server can be refreshed from
  // outside without the page pointing at anything different.
  fetch("api/data", { cache: "no-cache" }).then(function (r) {
    if (!r.ok) throw new Error("api/data: HTTP " + r.status);
    return r.json();
  }).then(function (p) {
    D = {};
    FILES.forEach(function (f) { D[f] = p[f]; });
    S = { series: p.series || {}, derived: p.derived || {}, fetched_at: p.series_fetched_at,
          analysis: p.analysis || {} };
    render(p.changelog);
  }).catch(function (err) {
    app.innerHTML = '<div class="error"><h2>The data layer did not load</h2><p>' +
      esc(err.message) + "</p></div>";
  });
}

var resizeTimer;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(redrawAll, 120);
});

initTheme();
initBands();
load();
})();
</script>
</body>
</html>
